<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSMART Abacus Poster</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eeeeee;
    text-align: center;
}

.container {
    padding: 20px 10px;
}

h2 {
    margin-bottom: 20px;
}

input[type="text"],
input[type="file"] {
    width: 95%;
    max-width: 400px;
    padding: 12px;
    margin: 8px;
    border-radius: 8px;
    border: 1px solid #aaa;
    background: white;
}

button {
    padding: 13px 22px;
    margin: 10px 5px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.create {
    background: #1565c0;
    color: white;
}

.download {
    background: #168a3a;
    color: white;
    display: none;
}

/* POSTER */
#poster {
    width: 360px;
    height: 510px;
    margin: 25px auto;
    background: linear-gradient(160deg, #eaf7ff, #ffffff);
    border-radius: 15px;
    padding: 18px;
    position: relative;
    overflow: hidden;
    display: none;
    box-shadow: 0 5px 20px rgba(0,0,0,0.25);
}

.logo {
    max-width: 95px;
    max-height: 70px;
    object-fit: contain;
    margin-bottom: 5px;
}

.brand {
    font-size: 27px;
    font-weight: bold;
    color: #064d9b;
}

.title {
    font-size: 25px;
    font-weight: bold;
    color: #e65100;
    margin-top: 10px;
}

.subtitle {
    font-size: 16px;
    font-weight: bold;
    color: #333;
    margin: 8px 0;
}

.photo-box {
    width: 155px;
    height: 180px;
    margin: 12px auto;
    border: 5px solid #1565c0;
    border-radius: 12px;
    overflow: hidden;
    background: #ddd;
}

.photo-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.name {
    font-size: 24px;
    font-weight: bold;
    color: #b71c1c;
    margin: 8px 0;
}

.details {
    font-size: 17px;
    line-height: 1.6;
    font-weight: bold;
    color: #222;
}

.contact {
    position: absolute;
    bottom: 12px;
    left: 0;
    right: 0;
    font-size: 14px;
    font-weight: bold;
    color: #333;
}
</style>
</head>

<body>

<div class="container">

<h2>🎓 BSMART ABACUS</h2>

<input type="text" id="studentName"
placeholder="Enter Student Name">

<br>

<input type="file" id="photoInput" accept="image/*">

<br>

<button class="create" onclick="createPoster()">
CREATE POSTER
</button>

<div id="poster">

    <!-- LOGO -->
    <img id="logo" class="logo" src="" style="display:none;">

    <div class="brand">BSMART ABACUS</div>

    <div class="title">
        PANCHAYATH LEVEL<br>
        ABACUS EXAM
    </div>

    <div class="subtitle">
        ഞങ്ങളും പങ്കെടുക്കുന്നു
    </div>

    <div class="photo-box">
        <img id="studentPhoto" src="">
    </div>

    <div class="name" id="posterName">
        STUDENT NAME
    </div>

    <div class="details">
        📅 27/09/2026 — SUNDAY<br>
        ⏰ 11:00 AM<br>
        📍 NOORUL ISLAM MADRASSA<br>
        VAZHANGALLY
    </div>

    <div class="contact">
        📞 9495062912
    </div>

</div>

<button class="download" id="downloadBtn"
onclick="downloadPoster()">
⬇️ DOWNLOAD POSTER
</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>

function createPoster() {

    const name = document.getElementById("studentName").value.trim();
    const photo = document.getElementById("photoInput").files[0];

    if (!name) {
        alert("Please enter the student's name.");
        return;
    }

    if (!photo) {
        alert("Please upload the student's photo.");
        return;
    }

    document.getElementById("posterName").innerText = name;

    const reader = new FileReader();

    reader.onload = function(e) {

        document.getElementById("studentPhoto").src = e.target.result;

        document.getElementById("poster").style.display = "block";

        document.getElementById("downloadBtn").style.display = "inline-block";

        window.scrollTo({
            top: document.getElementById("poster").offsetTop,
            behavior: "smooth"
        });
    };

    reader.readAsDataURL(photo);
}


function downloadPoster() {

    const poster = document.getElementById("poster");

    html2canvas(poster, {
        scale: 3,
        useCORS: true
    }).then(function(canvas) {

        const link = document.createElement("a");

        const name =
        document.getElementById("studentName").value
        || "BSMART_ABACUS";

        link.download = name + "_Abacus_Poster.png";

        link.href = canvas.toDataURL("image/png");

        link.click();

    });

}

</script>

</body>
</html>
